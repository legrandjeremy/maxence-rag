<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna - Voyante Intuitive</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .welcome-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            position: relative;
            overflow: hidden;
        }

        .welcome-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            z-index: -1;
        }

        .luna-icon {
            font-size: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
        }

        .title {
            font-size: 3rem;
            font-weight: 300;
            color: #333;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }

        .description {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .email-form {
            background: rgba(255, 255, 255, 0.3);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(5px);
        }

        .email-form h3 {
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .email-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .email-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 50px;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            outline: none;
        }

        .email-input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
        }

        .email-submit {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            min-width: 120px;
        }

        .email-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .email-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .success-message {
            background: rgba(76, 175, 80, 0.1);
            color: #388e3c;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .chat-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            text-decoration: none;
            display: block;
            font-weight: 500;
            letter-spacing: 1px;
            margin-left: 57px;
        }

        .chat-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        .feature {
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            transition: transform 0.3s ease;
        }

        .feature:hover {
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #667eea;
        }

        .feature-text {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
        }

        .mystical-elements {
            position: absolute;
            top: 20px;
            right: 20px;
            opacity: 0.1;
            font-size: 3rem;
            color: #764ba2;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .sparkles {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 20px;
            background: radial-gradient(circle, #667eea 1px, transparent 1px);
            background-size: 20px 20px;
            animation: sparkle 3s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* Iframe styles */
        .iframe-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .iframe-container {
            width: 95%;
            height: 95%;
            max-width: 1200px;
            max-height: 800px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            background: white;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 20px;
            background: white;
        }

        .close-button {
            position: absolute;
            top: -50px;
            right: 0;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-button:hover {
            background: white;
            transform: scale(1.1);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .welcome-container {
                padding: 30px 20px;
                margin: 20px;
            }

            .title {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .description {
                font-size: 1rem;
            }

            .email-input-group {
                flex-direction: column;
            }

            .email-submit {
                padding: 15px 25px;
                font-size: 1rem;
            }

            .chat-button {
                padding: 18px 35px;
                font-size: 1.1rem;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .iframe-container {
                width: 100%;
                height: 100%;
                border-radius: 0;
            }

            .close-button {
                top: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="sparkles"></div>
        <div class="mystical-elements">✨🌙🔮</div>
        
        <div class="luna-icon">🌟</div>
        <h1 class="title">Luna</h1>
        <p class="subtitle">Voyante Intuitive • Connectée</p>
        
        <p class="description">
            Découvrez les mystères qui vous entourent. Luna vous attend pour une consultation unique, 
            où intuition et guidance se rencontrent pour éclairer votre chemin.
        </p>
        
        <!-- Email Collection Form (disabled: guest session starts without email) -->
        <div class="email-form" id="emailForm" style="display: none;">
            <h3>✨ Commencez votre consultation</h3>
            <div class="email-input-group">
                <input 
                    type="email" 
                    class="email-input" 
                    id="emailInput" 
                    placeholder="Votre adresse email..." 
                    required
                >
                <button class="email-submit" id="emailSubmit" onclick="submitEmail()">
                    <span id="submitText">Commencer</span>
                    <div class="loading-spinner" id="loadingSpinner"></div>
                </button>
            </div>
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
        </div>

        <!-- Chat Button (now available immediately) -->
        <button class="chat-button" id="chatButton" onclick="openChat()">
            ✨ Entrer en consultation avec Luna
        </button>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🌙</div>
                <div class="feature-text">Guidance Intuitive</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔮</div>
                <div class="feature-text">Vision Claire</div>
            </div>
            <div class="feature">
                <div class="feature-icon">✨</div>
                <div class="feature-text">Énergie Positive</div>
            </div>
        </div>
    </div>

    <div class="iframe-overlay" id="iframeOverlay">
        <div class="iframe-container">
            <button class="close-button" onclick="closeChat()">✕</button>
            <iframe id="lunaIframe" src="/chat-iframe" title="Consultation avec Luna"></iframe>
        </div>
    </div>

    <script>
        let emailCollected = true; // email no longer required for guest chat
        const API_BASE_URL = 'https://7craymncc6.execute-api.us-east-1.amazonaws.com/staging'; // kept for backward compat (unused)

        function submitEmail() {
            const emailInput = document.getElementById('emailInput');
            const email = emailInput.value.trim();
            
            if (!email) {
                showError('Veuillez saisir votre adresse email');
                return;
            }

            if (!isValidEmail(email)) {
                showError('Veuillez saisir une adresse email valide');
                return;
            }

            setLoading(true);
            hideMessages();

            // Submit email to backend
            fetch(`${API_BASE_URL}/api/collect-email`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email: email })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    emailCollected = true;
                    // Store email for chat usage
                    localStorage.setItem('userEmail', email);
                    showSuccess('Email enregistré avec succès ! Préparation de votre consultation...');
                    
                    // Hide email form and show chat button
                    setTimeout(() => {
                        document.getElementById('emailForm').style.display = 'none';
                        document.getElementById('chatButton').classList.remove('hidden');
                        document.getElementById('chatButton').style.display = 'inline-block';
                    }, 1500);

                    // Store auth URL for later use if needed
                    if (data.auth0LoginUrl) {
                        localStorage.setItem('auth0LoginUrl', data.auth0LoginUrl);
                    }
                } else {
                    showError(data.error || 'Une erreur est survenue. Veuillez réessayer.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError('Erreur de connexion. Veuillez vérifier votre connexion internet.');
            })
            .finally(() => {
                setLoading(false);
            });
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function setLoading(loading) {
            const submitBtn = document.getElementById('emailSubmit');
            const submitText = document.getElementById('submitText');
            const spinner = document.getElementById('loadingSpinner');
            
            if (loading) {
                submitBtn.disabled = true;
                submitText.style.display = 'none';
                spinner.style.display = 'block';
            } else {
                submitBtn.disabled = false;
                submitText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        function checkExistingChatState() {
            try {
                const savedChat = localStorage.getItem('guestChat_currentChat');
                const savedEmail = localStorage.getItem('guestChat_userEmail');
                
                if (savedChat && savedEmail) {
                    const chatData = JSON.parse(savedChat);
                    const chatButton = document.getElementById('chatButton');
                    
                    if (chatData && chatData.id) {
                        // Update button text to indicate continuing session
                        chatButton.innerHTML = '🔄 Continuer ma consultation avec Luna';
                        chatButton.title = 'Continuer votre session existante';
                        console.log('Existing chat session found:', chatData.id);
                        return { chat: chatData, email: savedEmail };
                    }
                }
            } catch (err) {
                console.warn('Error checking existing chat state:', err);
            }
            return null;
        }

        function openChat() {
            const iframe = document.getElementById('lunaIframe');
            
            // Check if there's an existing chat to continue
            const existingState = checkExistingChatState();
            
            // Always reset iframe src to ensure fresh load with state recovery
            iframe.src = `/chat-iframe`;

            const overlay = document.getElementById('iframeOverlay');
            overlay.style.display = 'flex';
            
            // Add a small delay for smooth animation
            setTimeout(() => {
                overlay.style.opacity = '1';
                
                // If continuing existing session, inform user
                if (existingState) {
                    console.log('Opening existing chat session:', existingState.chat.id);
                }
            }, 10);
        }

        function closeChat() {
            const overlay = document.getElementById('iframeOverlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 300);
        }

        // Enter key support for email input
        const emailInputEl = document.getElementById('emailInput');
        if (emailInputEl) {
            emailInputEl.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    submitEmail();
                }
            });
        }

        // Add smooth transitions
        const overlay = document.getElementById('iframeOverlay');
        overlay.style.transition = 'opacity 0.3s ease';
        overlay.style.opacity = '0';

        // Check for callback from Auth0 (if user was redirected back)
        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // Check for existing chat state and update UI accordingly
            checkExistingChatState();
            
            // Payment success: inform iframe to unlock
            if (urlParams.get('payment') === 'success') {
                const iframe = document.getElementById('lunaIframe');
                try { iframe.contentWindow?.postMessage({ type: 'payment-success' }, '*'); } catch (_) {}
            }
        });

        // Listen to messages from iframe to adjust UI behavior
        window.addEventListener('message', function(event) {
            const data = event.data || {};
            if (data.type === 'disable-overlay-close') {
                const btn = document.querySelector('.close-button');
                if (btn) { btn.style.display = 'none'; }
            }
        });
    </script>
</body>
</html>
