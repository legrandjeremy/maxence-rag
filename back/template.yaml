                - maxence-rag:team-manager
                - maxence-rag:user
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - handlers/chat/update-chat.ts

  DeleteChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-luna-front-delete-chat
      CodeUri: src/
      Handler: handlers/chat/delete-chat.handler
      Role: !GetAtt PlayerManagementIamRole.Arn
      Environment:
        Variables:
          CLOUDFRONT_DOMAIN: !GetAtt PlayerManagementCloudFrontDistribution.DomainName
          BEDROCK_KNOWLEDGE_BASE_ID: X9CIYS980F
      Events:
        DeleteChat:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/chats/{chatId}
            Method: DELETE
            Auth:
              Authorizer: Auth0Authorizer
              AuthorizationScopes:
                - maxence-rag:admin
                - maxence-rag:team-manager
                - maxence-rag:user
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - handlers/chat/delete-chat.ts

  # Log Groups
  CreateUserFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-luna-front-create-user
      RetentionInDays: 14

  GetUsersFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-luna-front-get-users
      RetentionInDays: 14

  # Chat Management Log Groups
  CreateChatFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-luna-front-create-chat
      RetentionInDays: 14

  GetChatsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-luna-front-get-chats
      RetentionInDays: 14

  SendMessageFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-luna-front-send-message
      RetentionInDays: 14

  GetChatHistoryFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-luna-front-get-chat-history
      RetentionInDays: 14

  UpdateChatFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-luna-front-update-chat
      RetentionInDays: 14

  DeleteChatFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-luna-front-delete-chat
      RetentionInDays: 14

  # =============================================================================
  # WEBSOCKET INFRASTRUCTURE FOR LUNA STREAMING
  # =============================================================================

  # WebSocket Session Table for managing connections and message parts
  WebSocketSessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Environment}-luna-websocket-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: messagePartId
          AttributeType: N
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
        - AttributeName: messagePartId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expire
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: luna-websocket

  # WebSocket Lambda Function
  WebSocketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-luna-websocket-handler
      CodeUri: src/
      Handler: handlers/websocket/websocket-handler.handler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 900  # 15 minutes for long conversations
      Environment:
        Variables:
          NODE_ENV: production
          ENVIRONMENT: !Ref Environment
          WEBSOCKET_SESSION_TABLE: !Ref WebSocketSessionTable
          BEDROCK_REGION: !Ref AWS::Region
          BEDROCK_KNOWLEDGE_BASE_ID: !Ref BedrockKnowledgeBaseId
          AUTH0_ISSUER_URL: !Ref Auth0IssuerUrl
          AUTH0_AUDIENCE: !Ref Auth0Audience
          AUTH0_SECRET: !Ref Auth0ClientId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketSessionTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:GetFoundationModel
                - bedrock:ListFoundationModels
                - bedrock-runtime:InvokeModel
                - bedrock-runtime:InvokeModelWithResponseStream
                - bedrock-runtime:ConverseStream
                - bedrock-runtime:Converse
                - bedrock-agent-runtime:Retrieve
              Resource: "*"
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/*/*"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - handlers/websocket/websocket-handler.ts

  # WebSocket API Gateway
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${Environment}-luna-websocket-api
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"
      Description: Luna Real-time Streaming Chat WebSocket API
      Tags:
        Environment: !Ref Environment
        Application: luna-websocket

  # Connect Route
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Join
        - '/'
        - - 'integrations'
          - !Ref ConnectIntegration

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
        - LambdaArn: !GetAtt WebSocketFunction.Arn

  # Disconnect Route
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Join
        - '/'
        - - 'integrations'
          - !Ref DisconnectIntegration

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
        - LambdaArn: !GetAtt WebSocketFunction.Arn

  # Default Route (for message handling)
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Join
        - '/'
        - - 'integrations'
          - !Ref DefaultIntegration

  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
        - LambdaArn: !GetAtt WebSocketFunction.Arn

  # WebSocket Stage
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Environment
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      Tags:
        Environment: !Ref Environment
        Application: luna-websocket

  # Lambda Permissions for WebSocket API
  WebSocketConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebSocketFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*"

  # WebSocket Function Log Group
  WebSocketFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-luna-websocket-handler
      RetentionInDays: 14

Outputs:
  CloudFrontDomainName:
    Description: CloudFront domain name
    Value: !GetAtt PlayerManagementCloudFrontDistribution.DomainName
  S3BucketName:
    Description: S3 bucket name for documents
    Value: !Ref PlayerManagementDocumentsBucket
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  WebSocketApiUrl:
    Description: WebSocket API Gateway URL for Luna streaming
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${Environment}-luna-websocket-url"