AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  Player Management System

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - preprod
      - prod
    Default: staging
  Auth0IssuerUrl:
    Type: String
    Default: https://example.auth0.com/
  Auth0Audience:
    Type: String
    Default: luna-front-api
  Auth0ClientId:
    Type: String
    Description: Auth0 Application Client ID
    NoEcho: true
  Auth0ManagementClientId:
    Type: String
    Description: Auth0 Management API Client ID
    NoEcho: true
  Auth0ManagementClientSecret:
    Type: String
    Description: Auth0 Management API Client Secret
    NoEcho: true
  Auth0AdminRoleId:
    Type: String
    Description: Auth0 Role ID for admin users
  Auth0TeamManagerRoleId:
    Type: String
    Description: Auth0 Role ID for team manager users
  Auth0UserRoleId:
    Type: String
    Description: Auth0 Role ID for regular users
  BedrockKnowledgeBaseId:
    Type: String
    Description: Bedrock Knowledge Base ID
    Default: X9CIYS980F

Globals:
  Function:
    Architectures:
      - x86_64
    Runtime: nodejs22.x
    CodeUri: .
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        STRIPE_SECRET_KEY: "sk_test_51RwQBw0Xrngfa9BoHFO3cedbV8WbNr2iHA7SN3eRZcuSnF2NrzBrphTDY9JwBHnEyX0gIgqx7JBDqKAWFyPa8Klf00MBfGGTEe"
        STRIPE_WEBHOOK_SECRET: "whsec_7N5UUz66uBexouvbHTiXRuurbab16EYL"

Resources:
  ApiUrlSSMParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Environment}/luna-front/api_url
      Type: String
      Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
      Description: Base URL for the Player Management API

  ApiIdSSMParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Environment}/luna-front/api_id
      Type: String
      Value: !Ref Api
      Description: ID for the Player Management API

  PlayerManagementDocumentsBucketSSMParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Environment}/luna-front/documents_bucket
      Type: String
      Value: !Ref PlayerManagementDocumentsBucket
      Description: Bucket for the Player Management documents

  PlayerManagementCloudFrontDistributionIdSSMParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Environment}/luna-front/cloudfront_distribution_id
      Type: String
      Value: !Ref PlayerManagementCloudFrontDistribution
      Description: ID for the Player Management CloudFront distribution

  PlayerManagementTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Environment}-luna-front
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PlayerManagementDocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${Environment}-luna-front-documents
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - '*'
            MaxAge: 3600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub OAI for ${Environment}-luna-front

  PlayerManagementDocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PlayerManagementDocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity
                ${CloudFrontOriginAccessIdentity}
            Action: s3:GetObject
            Resource: !Sub ${PlayerManagementDocumentsBucket.Arn}/docs/*

  PlayerManagementCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - DomainName: !GetAtt PlayerManagementDocumentsBucket.RegionalDomainName
            Id: DocumentsOrigin
            S3OriginConfig:
              OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity}
        Enabled: true
        DefaultCacheBehavior:
          TargetOriginId: DocumentsOrigin
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          MinTTL: 31536000
          DefaultTTL: 31536000
          MaxTTL: 31536000
        CacheBehaviors:
          - PathPattern: docs/*
            TargetOriginId: DocumentsOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            MinTTL: 31536000
            DefaultTTL: 31536000
            MaxTTL: 31536000
        PriceClass: PriceClass_All
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Comment: !Sub ${Environment} - luna-front
        DefaultRootObject: index.html
        HttpVersion: http2and3

  PlayerManagementIamRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Environment}-luna-front
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${Environment}-luna-front
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: log
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt PlayerManagementTable.Arn
                  - !Sub ${PlayerManagementTable.Arn}/index/*
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt PlayerManagementDocumentsBucket.Arn
                  - !Sub ${PlayerManagementDocumentsBucket.Arn}/*
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - arn:aws:bedrock:us-east-1::foundation-model/*
                  - arn:aws:bedrock:us-east-1:033439678491:inference-profile/*
                  - arn:aws:bedrock:us-west-2::foundation-model/meta.llama3-2-3b-instruct-v1:0
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                  - bedrock:RetrieveAndGenerate
                  - bedrock:InvokeModel
                Resource:
                  - arn:aws:bedrock:us-east-1:*:knowledge-base/*

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Sub ${Environment}
      FailOnWarnings: true
      Auth:
        Authorizers:
          Auth0Authorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              audience:
                - !Ref Auth0Audience
              issuer: !Ref Auth0IssuerUrl
        DefaultAuthorizer: Auth0Authorizer
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowOrigins:
          - '*'
        MaxAge: 600

  # Public Functions (No Auth Required)
  CreateCheckoutSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-luna-front-create-checkout-session
      CodeUri: src/
      Handler: handlers/payments/create-checkout-session.handler
      Role: !GetAtt PlayerManagementIamRole.Arn
      Environment:
        Variables:
          CLOUDFRONT_DOMAIN: !GetAtt PlayerManagementCloudFrontDistribution.DomainName
          FRONTEND_URL: !Sub "https://${PlayerManagementCloudFrontDistribution.DomainName}"
      Events:
        CreateCheckoutSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/payments/checkout
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - handlers/payments/create-checkout-session.ts

